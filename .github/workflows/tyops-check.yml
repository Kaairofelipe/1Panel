name: Typos Check
on: pull_request
jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@ee0669bd1cc54295c223e0ce666b36208fdfddf5
    - name: Check spelling
      uses: crate-ci/typos@2c2a93130d8c1c5a9b751bc954f9a03986227db0